<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16161A" media="(prefers-color-scheme: dark)">
<title>Wecker</title>
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  /* The colours of the Plugin Hub's "Planblatt": the rule, orange for what you can do, green, amber
     and red for how something stands */
  :root {
    --bg: #F2F1EC; --text: #1A1A1D; --muted: #5E5D58; --faint: #8C8A84; --rule: #6B6A64;
    --accent: #E07A18; --accent-text: #241403; --ok: #2B7A38; --warn: #946200; --danger: #C4302B;
    --button: #FBFAF6; --button-line: #BEBCB4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161A; --text: #EEEEF1; --muted: #A7A7B2; --faint: #767682; --rule: #7C7C88;
      --accent: #F0892E; --accent-text: #1F1204; --ok: #62C370; --warn: #E3B341; --danger: #F0625F;
      --button: #222228; --button-line: #41414B;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
  }
  main { max-width: 440px; margin: 0 auto; }
  .head { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
  .head img { width: 36px; height: 36px; border-radius: 8px; }
  .crumb { font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
  h1 { margin: 1px 0 0; font-size: 19px; letter-spacing: .07em; text-transform: uppercase; }
  .state { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 5px 12px; align-items: center; margin: 28px 0 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--faint); }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  .dot.bad { background: var(--danger); }
  .dot.busy { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .dot.busy { animation-duration: 2.6s; } }
  .what { font-size: 21px; font-weight: 650; }
  .more { grid-column: 2; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  .btn {
    appearance: none; display: inline-flex; align-items: center; justify-content: center; min-height: 46px;
    padding: 0 18px; border-radius: 6px; border: 1px solid var(--button-line); background: var(--button);
    color: var(--text); font: 600 16px system-ui, -apple-system, sans-serif; text-decoration: none; cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  [hidden] { display: none !important; }
  .hints { margin: 20px 0 0; padding: 12px 0 0 20px; border-top: 1px solid color-mix(in srgb, var(--rule) 45%, transparent); color: var(--muted); font-size: 15px; }
  .hints li + li { margin-top: 6px; }
</style>
</head>
<body>
<main>
  <div class="head">
    <img src="/icon.png" alt="">
    <div><div class="crumb">Plugin Hub</div><h1>Wecker</h1></div>
  </div>

  <div class="state" role="status" aria-live="polite">
    <span class="dot busy" id="dot"></span><span class="what" id="what">Ich sehe nach&nbsp;…</span>
    <span class="more" id="more">ob dein PC wach ist.</span>
  </div>

  <ul class="hints" id="hints" hidden>
    <li>Hängt der Laptop am Netzteil und am LAN-Kabel? Über WLAN lässt er sich nicht wecken.</li>
    <li>Wurde er heruntergefahren? Wecken geht nur aus „Energie sparen“ und aus dem Ruhezustand.</li>
  </ul>

  <div class="actions">
    <button type="button" class="btn primary" id="wake" hidden>PC wecken</button>
    <a class="btn primary" id="hub" hidden>Plugin Hub</a>
    <a class="btn" id="bot" hidden>TISS Bot</a>
  </div>
</main>

<script>
  // What the Pi was told (/etc/wecker.json): where the hub and the bot are, whether opening wakes at once
  const S = /*SETTINGS*/{};
  const $ = (id) => document.getElementById(id);
  const wakeButton = $('wake'), hubLink = $('hub'), botLink = $('bot');
  // A place in the hub after "#" - a push from the Melder opens the code requests so:
  // https://wecker…/#/mails?feld=anfragen. Only the hub's own routes, never another address.
  const place = /^#\/[\w\/?=&%.-]*$/.test(location.hash) ? location.hash : '';
  const hubTarget = place ? S.hub.replace(/#.*$/, '') + place : S.hub;
  hubLink.href = hubTarget;
  if (S.bot) botLink.href = S.bot;

  let since = 0;        // when the wake-up call went out
  let again = false;    // the second call, in case the first one got lost
  let timer = 0;
  let onward = true;    // on to the hub by itself - not when coming back from it

  const seconds = () => Math.round((Date.now() - since) / 1000);
  const PATIENCE = 'Meist dauert das 10 bis 30 Sekunden, aus dem Ruhezustand bis zu einer Minute.';

  function show(dot, what, more, { wake = false, hub = false, bot = false, hints = false } = {}) {
    $('dot').className = `dot ${dot}`;
    $('what').textContent = what;
    $('more').textContent = more;
    wakeButton.hidden = !wake;
    hubLink.hidden = !hub;
    botLink.hidden = !bot || !S.bot;
    $('hints').hidden = !hints;
  }

  const call = () => fetch('/wake', { method: 'POST', headers: { 'X-Wecker': '1' } }).catch(() => {});

  async function wake() {
    since = Date.now();
    again = false;
    show('warn busy', 'PC wird geweckt …', PATIENCE);
    await call();
    look();
  }

  async function look() {
    clearTimeout(timer);
    let state;
    try {
      const answer = await fetch('/status', { cache: 'no-store' });
      if (!answer.ok) throw new Error(String(answer.status));
      state = (await answer.json()).state;
    } catch {
      show('bad', 'Der Wecker antwortet nicht', 'Ist Tailscale auf diesem Gerät an? Dann die Seite neu laden.');
      return;
    }

    if (state === 'hub') return arrived();

    if (state === 'awake') {
      // Up, but the hub is not there yet - after a restart Windows waits for the sign-in first
      show('ok busy', 'Der PC ist wach', since && seconds() > 45
        ? 'Der Hub antwortet nicht. Hat Windows neu gestartet? Dann startet er erst, wenn du dich am PC anmeldest.'
        : 'Der Hub antwortet noch nicht …', { hub: true, bot: true });
      timer = setTimeout(look, 2000);
      return;
    }

    if (!since) {
      if (S.wakeOnOpen) return wake();
      show('', 'Der PC schläft', 'Der Wecker kann ihn über dein Heimnetz aufwecken.', { wake: true });
      return;
    }
    if (seconds() > S.waitSeconds) {
      wakeButton.textContent = 'Noch einmal wecken';
      show('bad', 'Der PC wacht nicht auf', `Seit ${seconds()} Sekunden keine Antwort.`, { wake: true, hints: true });
      return;
    }
    show('warn busy', 'PC wird geweckt …', `${seconds()} Sekunden. ${PATIENCE}`);
    if (seconds() >= 20 && !again) {
      again = true;
      call();
    }
    timer = setTimeout(look, 2000);
  }

  function arrived() {
    show('ok', 'Der PC ist wach', `${since ? `Nach ${seconds()} Sekunden.` : 'Er war schon wach.'} ${onward ? 'Der Plugin Hub öffnet sich …' : ''}`,
      { hub: true, bot: true });
    // A moment for the bot's button, then the hub
    if (onward) timer = setTimeout(() => { onward = false; location.href = hubTarget; }, 2000);
  }

  for (const link of [hubLink, botLink]) link.addEventListener('click', () => { onward = false; clearTimeout(timer); });
  wakeButton.addEventListener('click', wake);

  // Back from the hub (the back gesture, or the tab woken up again): look again, but stay here
  window.addEventListener('pageshow', (e) => {
    if (!e.persisted) return;
    onward = false;
    since = 0;
    look();
  });
  look();
</script>
</body>
</html>
